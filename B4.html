<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>WebAR Solar Panel Model</title>

    <!-- A-Frame -->
    <script
        src="https://aframe.io/releases/1.6.0/aframe.min.js">
    </script>

    <!-- AR.js Marker Tracking -->
    <script
        src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js">
    </script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .instruction {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            padding: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 8px;
            text-align: center;
            z-index: 10;
        }
    </style>
<script src="lab-support.js"></script>
</head>

<body>

    <div class="instruction">
        Allow camera access and point the camera at the Hiro marker.
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; colorManagement: true;"
        arjs="
            sourceType: webcam;
            trackingMethod: best;
            debugUIEnabled: false;
        "
    >

        <!-- Lighting -->
        <a-light
            type="ambient"
            color="#FFFFFF"
            intensity="1.2">
        </a-light>

        <a-light
            type="directional"
            color="#FFFFFF"
            intensity="1.5"
            position="1 3 2">
        </a-light>

        <!-- Hiro marker -->
        <a-marker preset="hiro">

            <!-- Complete solar panel structure -->
            <a-entity
                position="0 0 0"
                scale="0.3 0.3 0.3"
                animation="
                    property: rotation;
                    to: 0 360 0;
                    loop: true;
                    dur: 12000;
                    easing: linear;
                "
            >

                <!-- Base -->
                <a-box
                    position="0 0.05 0"
                    width="2.4"
                    height="0.1"
                    depth="1.5"
                    color="#555555">
                </a-box>

                <!-- Left support post -->
                <a-box
                    position="-0.7 0.6 0"
                    width="0.12"
                    height="1.1"
                    depth="0.12"
                    color="#B0B0B0">
                </a-box>

                <!-- Right support post -->
                <a-box
                    position="0.7 0.6 0"
                    width="0.12"
                    height="1.1"
                    depth="0.12"
                    color="#B0B0B0">
                </a-box>

                <!-- Solar panel frame -->
                <a-box
                    position="0 1.25 0"
                    rotation="-25 0 0"
                    width="2.2"
                    height="0.12"
                    depth="1.3"
                    color="#202020">
                </a-box>

                <!-- Blue solar panel surface -->
                <a-box
                    position="0 1.32 -0.03"
                    rotation="-25 0 0"
                    width="2.05"
                    height="0.04"
                    depth="1.15"
                    color="#145DA0"
                    metalness="0.2"
                    roughness="0.5">
                </a-box>

                <!-- Solar-cell grid lines -->
                <a-box
                    position="-0.67 1.35 -0.05"
                    rotation="-25 0 0"
                    width="0.025"
                    height="0.02"
                    depth="1.1"
                    color="#FFFFFF">
                </a-box>

                <a-box
                    position="0 1.35 -0.05"
                    rotation="-25 0 0"
                    width="0.025"
                    height="0.02"
                    depth="1.1"
                    color="#FFFFFF">
                </a-box>

                <a-box
                    position="0.67 1.35 -0.05"
                    rotation="-25 0 0"
                    width="0.025"
                    height="0.02"
                    depth="1.1"
                    color="#FFFFFF">
                </a-box>

                <a-box
                    position="0 1.12 0.46"
                    rotation="-25 0 0"
                    width="2.0"
                    height="0.02"
                    depth="0.025"
                    color="#FFFFFF">
                </a-box>

                <a-box
                    position="0 1.58 -0.54"
                    rotation="-25 0 0"
                    width="2.0"
                    height="0.02"
                    depth="0.025"
                    color="#FFFFFF">
                </a-box>

            </a-entity>

        </a-marker>

        <!-- AR camera -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
