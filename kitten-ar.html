<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151b1d"><title>Kitten Marker · House AR</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui,sans-serif;background:#151b1d;color:white}a-scene{position:fixed!important;inset:0;width:100%!important;height:100%!important}#ar-controls,#ar-status-panel{position:fixed!important;display:block!important;z-index:10000!important;left:12px;right:12px;background:#152023e8;border:1px solid #ffffff40;border-radius:14px;padding:12px 16px}#ar-controls{top:max(12px,env(safe-area-inset-top))}#ar-status-panel{bottom:max(12px,env(safe-area-inset-bottom))}h1{font-size:1rem;margin:0 0 6px}p{margin:6px 0;font-size:.87rem;line-height:1.4}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}a,button{color:white;background:#304349;border:1px solid #789096;border-radius:8px;font:inherit;font-size:.85rem;padding:10px;text-decoration:none;min-height:42px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e2ffb0}#detail{color:#c3d2d7;font-size:.77rem}.a-enter-vr{display:none!important}</style>
<link rel="stylesheet" href="assets/viewer.css">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
<script src="site-state.js"></script>
<script>
AFRAME.registerComponent('fit-house',{
  init(){
    this.el.addEventListener('model-loaded',()=>{
      const T=AFRAME.THREE,mesh=this.el.getObject3D('mesh');
      // Measure a detached copy: a tracked marker's world rotation/translation
      // must never influence the house's local dimensions or centring.
      const measurement=new T.Group();
      measurement.add(mesh.clone(true));
      measurement.updateMatrixWorld(true);
      const bounds=new T.Box3().setFromObject(measurement),size=bounds.getSize(new T.Vector3()),center=bounds.getCenter(new T.Vector3());
      if(bounds.isEmpty()||![size.x,size.y,size.z].every(Number.isFinite)){this.el.emit('model-fit-failed',null,false);return;}
      const scale=.9/Math.max(size.x,size.z,size.y,.001);
      this.el.object3D.scale.setScalar(scale);
      // Centre the house in all three axes before the presentation rotation.
      this.el.object3D.position.copy(center).multiplyScalar(-scale);
      this.el.emit('model-fitted',null,false);
    });
    this.el.addEventListener('model-error',()=>this.el.emit('model-fit-failed',null,false));
  }
});
</script></head><body>
<header id="ar-controls"><h1>Kitten marker · Your 3D house</h1><p>Point your camera at the <strong>bordered kitten marker</strong> on another screen or paper. Keep the whole black square visible.</p><nav><a href="kitten-marker.html" target="_blank" rel="noopener">Show kitten marker</a><button id="rotate" type="button">Rotate house</button><button id="reset" type="button">Reset view</button><a href="lab3.html">Back to Lab 3</a></nav></header>
<footer id="ar-status-panel" role="status" aria-live="polite"><p id="status">Starting camera… Allow camera access when asked.</p><p id="detail">Marker: waiting · House: loading</p></footer>
<a-scene embedded vr-mode-ui="enabled:false" loading-screen="enabled:false" renderer="antialias:true; colorManagement:true; logarithmicDepthBuffer:true; precision:high; toneMapping:ACESFilmic" arjs="sourceType:webcam; debugUIEnabled:false; trackingMethod:best; patternRatio:0.5;">
<a-marker id="kitten" type="pattern" url="kitten.patt" size="1" emitevents="true" smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="2">
<!-- Front faces the viewer when the marker is displayed vertically on a screen.
     Keep presentation tilt separate from the user's rotation around house-up. -->
<a-entity id="presentation" rotation="-70 0 0" position="0 0.28 0">
<a-entity id="turn" rotation="0 -25 0"><a-entity id="house" gltf-model="reference-house.glb" fit-house></a-entity></a-entity>
</a-entity>
</a-marker><a-entity light="type:ambient; intensity:0.85"></a-entity><a-entity light="type:directional; intensity:0.8" position="-1 3 2"></a-entity><a-entity camera></a-entity></a-scene>
<script>
// Explicit state machines (see site-state.js and AGENTS.md): camera, tracking (kitten marker)
// and model (house) are mirrored as data-*-state on <html>; the status lines are derived from them.
(()=>{
 const status=document.getElementById('status'),detail=document.getElementById('detail');
 const camera=SiteState.createMachine(SiteState.machines.camera),tracking=SiteState.createMachine(SiteState.machines.tracking),model=SiteState.createMachine(SiteState.machines.model);
 const cameraProblem={insecure:'Open this page over HTTPS so the camera can start.',blocked:'Camera unavailable. Allow camera access and open this link in Chrome or Safari.',unsupported:'Camera unavailable. Allow camera access and open this link in Chrome or Safari.'};
 function render(){
  detail.textContent='Marker: '+(tracking.is('found')?'FOUND':'waiting')+' · House: '+model.state;
  status.textContent=cameraProblem[camera.state]||(model.is('error')?'The house could not load. Check your connection and reload.':tracking.is('found')?(model.is('ready')?'Kitten found! The house is above the marker.':'Kitten found. Loading the house…'):'Point at the bordered kitten marker. Keep its entire black border in view.');
 }
 [camera,tracking,model].forEach(machine=>machine.subscribe(render));
 const target=document.getElementById('house');
 target.addEventListener('model-fitted',()=>model.send('LOADED'));
 target.addEventListener('model-fit-failed',()=>model.send('FAILED'));
 SiteState.bindMarkerAR(document.getElementById('kitten'),camera,tracking);
 document.getElementById('rotate').addEventListener('click',()=>{const o=document.getElementById('turn').object3D;o.rotation.y+=Math.PI/2;});
 document.getElementById('reset').addEventListener('click',()=>{document.getElementById('turn').object3D.rotation.set(0,-25*Math.PI/180,0);});
})();
</script></body></html>
