<!DOCTYPE html>
<html lang="en">
  <head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>WebAR Red Box</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <script src="lab-support.js"></script>
</head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded vr-mode-ui="enabled:false" loading-screen="enabled:false" arjs="sourceType:webcam; debugUIEnabled:false">
      
      <a-marker preset="hiro">
        <a-box position="0 0.25 0" width="0.5" height="0.5" depth="0.5" 
               material="color: red; opacity: 0.8;" 
               animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
        </a-box>
      </a-marker>

      <a-entity camera></a-entity>
      
    </a-scene>
  </body>
</html>
